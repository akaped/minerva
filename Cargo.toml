[workspace]
members = ["crates/minerva-core", "crates/minerva-server", "crates/minerva-client", "crates/minerva-desktop"]
default-members = ["crates/minerva-core", "crates/minerva-server", "crates/minerva-client"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.3.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
