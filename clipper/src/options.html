<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="clipper.css" />
    <script src="options.js" defer></script>
  </head>
  <body class="options">
    <main>
      <header>
        <img src="icons/icon-48.png" alt="" width="32" height="32" />
        <h1 data-i18n="optionsTitle"></h1>
      </header>

      <form id="connect" hidden>
        <p data-i18n="optionsIntro"></p>
        <label>
          <span data-i18n="serverLabel"></span>
          <input name="server" type="text" inputmode="url" autocomplete="url" required data-i18n-placeholder="serverPlaceholder" />
        </label>
        <p class="error" role="alert" id="error"></p>
        <button class="primary" id="connect-button" data-i18n="connectButton"></button>
        <p class="hint" data-i18n="connectHint"></p>
      </form>

      <section id="connected" hidden>
        <p class="done" id="connected-text"></p>
        <p class="hint" data-i18n="connectedHint"></p>
        <button type="button" id="disconnect" data-i18n="disconnect"></button>
      </section>
    </main>
  </body>
</html>
