# Builds the Minerva desktop app for Linux and Windows.
#
# Push a version tag to publish a GitHub release with both packages:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match `version` in Cargo.toml. Running the workflow by hand
# builds the packages as downloadable artifacts without releasing them.
name: Desktop release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # The oldest supported Ubuntu, so the Linux build runs on as many systems
    # as possible (programs built on newer systems need newer libraries).
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      # WebKitGTK and GTK for Linux; MinGW-w64 to cross-compile for Windows.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev gcc-mingw-w64-x86-64 zip

      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop

      # The app embeds the web bundle; rebuild it from source.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build the web app
        run: |
          npm ci
          npm run build

      - name: Package Linux and Windows
        run: scripts/package-desktop.sh linux windows

      - uses: actions/upload-artifact@v4
        with:
          name: minerva-desktop
          path: dist/*
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Minerva $GITHUB_REF_NAME" --generate-notes
          fi
