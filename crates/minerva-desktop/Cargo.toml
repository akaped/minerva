[package]
name = "minerva-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minerva desktop client for Windows, macOS and Linux"
[[bin]]
name = "minerva"
path = "src/main.rs"
[dependencies]
minerva-client = { path = "../minerva-client" }
serde.workspace = true
serde_json.workspace = true
http = "1"
url = "2"
percent-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tao = "0.35"
wry = { version = "0.55", features = ["linux-body"] }
dirs = "6"
open = "5"
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
muda = { version = "0.19", default-features = false }
[build-dependencies]
embed-resource = "3"
