[package]
name = "minerva-server"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
minerva-core = { path = "../minerva-core" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
pulldown-cmark = "0.13"
ammonia = "4"
sha2 = "0.10"
yrs = "0.24"
base64 = "0.22"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-stream = "0.3"
futures-util = "0.3"
chacha20poly1305 = "0.10"
math-core = "0.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
hmac = "0.12"
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "html", "regex-fancy"] }
ruzstd = "0.9.1"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "builder", "hostname", "ring", "webpki-roots"] }
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
